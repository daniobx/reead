<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
}

.container {
  max-width: 850px;
  margin: 35px auto;
  padding: 20px;
}

.player {
  background: #000;
  border-radius: 10px;
  overflow: hidden;
}

video {
  width: 100%;
  display: block;
  max-height: 480px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 20px 0 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 6px;
  background: #e50914;
  color: white;
  cursor: pointer;
  margin: 5px;
  font-size: 15px;
}

button:hover {
  background: #b80710;
}

.download {
  background: #222;

}

<header>VIDEY PLAYER</header>

<div class="container">

  <div class="player">
    <video id="video" controls playsinline>
      <source src="" type="video/mp4">
      Browser tidak mendukung video.
    </video>
  </div>

  <input
    type="url"
    id="videoUrl"
    placeholder="https://cdn2.videy.co/DjWfPz3P1.mp4"
  >

  <button onclick="playVideo()">PLAY VIDEO</button>

  <button class="download" onclick="downloadVideo()">
    DOWNLOAD
  </button>

</div>

<footer>
  © 2026 Video plays
</footer>

<script>
function playVideo() {
  const url = document.getElementById("videoUrl").value.trim();
  const video = document.getElementById("video");

  if (!url) {
    alert("https://cdn2.videy.co/DjWfPz3P1.mp4");
    return;
  }

  video.src = url;
  video.load();
  video.play();
}

function downloadVideo() {
  const url = document.getElementById("videoUrl").value.trim();

  if (!url) {
    alert("https://cdn2.videy.co/DjWfPz3P1.mp4);
    return;
  }

  const link = document.createElement("a");
  link.href = url;
  link.download = "https://t.co/dptXIgkv8t";
  link.target = "_blank";
  link.click();
}
</script>
